[project]
name = "streamgate"
dynamic = ["version"]
description = "A data-quality firewall for Kafka"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Pratham S Kore" }]
keywords = ["kafka", "data-quality", "streaming", "validation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "confluent-kafka>=2.6",
    "prometheus-client>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
]

[project.scripts]
streamgate = "streamgate.cli:main"

[project.urls]
Homepage = "https://github.com/prathamsk333/streamGate"
Repository = "https://github.com/prathamsk333/streamGate"
Issues = "https://github.com/prathamsk333/streamGate/issues"
Changelog = "https://github.com/prathamsk333/streamGate/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/streamgate/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/streamgate"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PT", "PL", "S", "TID"]
ignore = [
    "PLR0913",  # rule specs legitimately take many keyword args
    "PLR2004",
    "S105",     # flags any string constant named like PASS/TOKEN
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "PT018"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: needs a running Kafka broker (STREAMGATE_TEST_BOOTSTRAP, default localhost:9092)",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["streamgate"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
