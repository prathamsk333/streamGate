# Kafka + StreamGate guarding the `orders` stream from examples/.
#
#   docker compose -f docker/compose.example.yml up -d --build
#
# Kafka is reachable from the host on localhost:9092, metrics on localhost:9108.
name: streamgate-example

services:
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 20

  topics:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in raw.orders clean.orders quarantine.orders; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 \
            --create --if-not-exists --topic "$$t" --partitions 3 --replication-factor 1
        done

  streamgate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: streamgate:dev
    depends_on:
      topics:
        condition: service_completed_successfully
    volumes:
      - ../examples:/etc/streamgate:ro
    environment:
      STREAMGATE_KAFKA__BOOTSTRAP_SERVERS: kafka:19092
      STREAMGATE_LOGGING__FORMAT: json
    ports:
      - "9108:9108"
    stop_grace_period: 40s
